name: Update playlist data

on:
  schedule:
    # Tried every day at 04:07 UTC, but the work only happens once a week: the check below skips the
    # run if data.js was already refreshed since Thursday 04:00 UTC (4am UK in winter, 5am in summer).
    # GitHub's schedules are best-effort and can be skipped, so a missed Thursday is picked up the next day.
    - cron: '7 4 * * *'
  workflow_dispatch:
  # TEMPORARY: lets a push run the update on demand (manual runs can't be started from here). Removed straight after.
  push:
    branches: [main]
    paths: ['.github/workflows/update-data.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this week's update is already done
        id: fresh
        if: github.event_name == 'schedule'
        run: bash scripts/data-is-current.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Rebuild data.js from Spotify
        if: steps.fresh.outputs.skip != 'true'
        run: node scripts/update-data.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MB_CONTACT: ${{ vars.MB_CONTACT }}
      - name: Commit if changed
        if: steps.fresh.outputs.skip != 'true'
        run: |
          if git diff --quiet -- data.js index.html; then
            echo "No changes to data.js or index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update playlist data from Spotify" -- data.js index.html
          git push
